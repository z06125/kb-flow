<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KB · 个人知识库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f9;--card:#ffffff;--line:#e6e9f0;--fg:#1b2030;--dim:#69707f;
--acc:#4c6ef5;--accsoft:#edf0ff;--warn:#b45309;
--shadow:0 1px 3px rgba(16,24,40,.06),0 10px 28px -14px rgba(16,24,40,.14)}
html[data-theme=dark]{--bg:#0e1016;--card:#171b26;--line:#262c3a;--fg:#e7eaf2;--dim:#8b93a6;
--acc:#8298ff;--accsoft:#1d2440;--warn:#f5b04c;
--shadow:0 1px 3px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.55)}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);
font:15px/1.7 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;
background:var(--card);color:var(--fg);border:1px solid var(--line);padding:8px 14px;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button.primary:hover{opacity:.9;color:#fff}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);
border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 0 10px}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
.hrow{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#4c6ef5,#22b8cf);
box-shadow:0 0 0 4px var(--accsoft)}
.search{flex:1;display:flex;gap:8px}
.search input{flex:1;min-width:0}
.hsub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);
border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
#stat{font-size:12.5px;color:var(--dim)}
main{max-width:880px;margin:18px auto 80px;padding:0 18px}
.gdate{font-size:12.5px;font-weight:600;color:var(--dim);margin:22px 4px 8px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:16px 18px;margin:10px 0;cursor:pointer;box-shadow:var(--shadow);transition:.16s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.card h3{font-size:15.5px;font-weight:600;line-height:1.5;margin-bottom:6px}
.card .tldr{font-size:13.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.badge{border-radius:999px;padding:1.5px 9px;background:var(--accsoft);color:var(--acc);font-size:11.5px}
.tag{border-radius:999px;padding:1.5px 9px;border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
mark{background:#ffe58f;color:inherit;padding:0 2px;border-radius:3px}
html[data-theme=dark] mark{background:#5b4a12;color:#ffd76a}
.empty{text-align:center;color:var(--dim);padding:70px 20px}
.empty .big{font-size:44px;margin-bottom:12px}
.more{text-align:center;margin:18px 0}
#more{display:none;min-width:140px}
.fab{position:fixed;right:26px;bottom:26px;width:52px;height:52px;border-radius:50%;
font-size:24px;background:var(--acc);color:#fff;border:none;box-shadow:var(--shadow);z-index:30}
.fab:hover{transform:scale(1.06)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;
max-width:760px;width:94vw;padding:24px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,12,20,.55);backdrop-filter:blur(2px)}
dialog h2{font-size:18px;line-height:1.55;margin-bottom:4px}
.mmeta{font-size:12.5px;color:var(--dim);margin-bottom:14px;word-break:break-all}
.tldrbox{background:var(--accsoft);border-radius:12px;padding:12px 16px;margin:12px 0;
font-weight:600;line-height:1.7}
.sect{font-size:13px;font-weight:700;color:var(--acc);margin:18px 0 6px;letter-spacing:.5px}
ul.pts{padding-left:20px}ul.pts li{margin:5px 0}
blockquote{border-left:3px solid var(--acc);padding:2px 14px;margin:10px 0;color:var(--dim)}
.fc{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.fc b{color:var(--acc)}
pre.raw{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);
border-radius:10px;padding:12px;font-size:13px;max-height:300px;overflow:auto}
.fgrid input,.fgrid textarea{width:100%;margin-bottom:8px}
.fgrid textarea{min-height:120px;resize:vertical}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:99;
background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 18px;font-size:13.5px;
opacity:0;pointer-events:none;transition:.3s;max-width:80vw}
#toast.show{opacity:1}
.dimm{color:var(--dim);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);
border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:640px){.hrow{flex-wrap:wrap}.logo{font-size:16px}.fab{right:16px;bottom:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div class="logo"><span class="dot"></span>个人知识库</div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索标题 / 正文 / 语义（支持自然语言长句）…">
      <button class="primary" onclick="doSearch()">搜索</button>
    </div>
    <button id="cfgbtn" title="模型设置（换 API 厂商）" style="padding:8px 10px">⚙️</button>
    <button id="theme" title="明暗切换" style="padding:8px 10px">🌓</button>
  </div>
  <div class="hsub">
    <div class="chips" id="chips"></div>
    <div id="stat">连接中…</div>
  </div>
</div></header>

<main>
  <div id="list"><p class="empty"><span class="big">📚</span><br>加载中…</p></div>
  <div class="more"><button id="more">加载更多</button></div>
</main>

<button class="fab" id="add" title="手动剪藏">＋</button>
<dialog id="clipdlg">
  <h2>✂️ 剪藏入库</h2>
  <p class="dimm" style="margin:4px 0 14px">入库后自动生成知识卡（结论 / 要点 / 标签）</p>
  <div class="fgrid">
    <input id="c_title" type="text" placeholder="标题（可留空，默认取正文首行）">
    <input id="c_url" type="text" placeholder="来源 URL（可留空）">
    <textarea id="c_text" placeholder="粘贴正文（至少 20 字）…"></textarea>
  </div>
  <p class="dimm" id="c_msg" style="min-height:20px;margin-bottom:8px"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button onclick="clipdlg.close()">取消</button>
    <button class="primary" id="c_go" onclick="doClip()">入库</button>
  </div>
</dialog>
<dialog id="setdlg">
  <h2>⚙️ 模型设置 · 换 API 厂商入口</h2>
  <p class="dimm" style="margin:6px 0 14px">支持任何 OpenAI 兼容厂商（DeepSeek / Kimi / 通义千问 / 硅基流动…）。
  填地址 + Key + 模型名，保存即生效。留空的项保持不变。</p>
  <div class="fgrid">
    <input id="s_base" type="text" placeholder="API 地址，如 https://api.deepseek.com/v1">
    <input id="s_key" type="text" placeholder="API Key（留空 = 沿用已保存的）">
    <div style="display:flex;gap:8px">
      <input id="s_chat" type="text" placeholder="聊天模型名" style="flex:1">
      <input id="s_embed" type="text" placeholder="向量模型名（可选）" style="flex:1">
      <input id="s_dim" type="number" placeholder="维度" style="width:90px">
    </div>
  </div>
  <p class="dimm" id="s_msg" style="min-height:20px;margin:8px 0"></p>
  <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
    <button onclick="testCfg()">测试连接</button>
    <button onclick="reembed()" title="更换向量模型后点一次，几分钟内自动重建">重建全部向量</button>
    <button class="primary" onclick="saveCfg()">保存</button>
    <button onclick="setdlg.close()">关闭</button>
  </div>
</dialog>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const SRC={clip:["✂️","剪藏"],rss:["📰","订阅"],tg:["🤖","TG"],doc:["📄","文档"],
book:["📚","书籍"],yt:["▶️","视频"],x:["𝕏","X"]};
const srcBadge=s=>{const v=SRC[s]||["🗂","其他"];return `<span class="badge">${v[0]} ${v[1]}</span>`};

/* 主题 */
const themeBtn=$("#theme");
if(localStorage.kbtheme)document.documentElement.dataset.theme=localStorage.kbtheme;
themeBtn.onclick=()=>{const d=document.documentElement;
d.dataset.theme=d.dataset.theme==="dark"?"":"dark";
localStorage.kbtheme=d.dataset.theme;};

/* 令牌：支持 ?token=xxx 自动登录 */
const qp=new URLSearchParams(location.search).get("token");
if(qp){localStorage.kbtoken=qp;history.replaceState({}, "", location.pathname);}
let TOKEN=localStorage.kbtoken||"";
if(!TOKEN){TOKEN=prompt("首次使用：请粘贴访问令牌 KB_TOKEN")||"";
localStorage.kbtoken=TOKEN;}

async function api(p,o={}){
  o.headers=Object.assign({"X-API-Token":TOKEN,"Content-Type":"application/json"},o.headers||{});
  const r=await fetch(p,o);
  if(r.status===401){localStorage.removeItem("kbtoken");location.reload();throw 0;}
  return r.json();
}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

function relTime(ts){
  if(!ts)return "";
  const d=new Date(ts.replace(" ","T")),now=new Date();
  const hm=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const day=x=>`${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`;
  const diff=(now-d)/864e5;
  if(day(d)===day(now))return `今天 ${hm}`;
  if(diff<2&&day(d)!==day(now))return `昨天 ${hm}`;
  if(diff<7)return `${Math.floor(diff)} 天前`;
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function gdate(ts){
  const d=new Date(ts.replace(" ","T")),now=new Date();
  const day=x=>`${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`;
  const diff=(now-d)/864e5;
  if(day(d)===day(now))return "今天";
  if(diff<2)return "昨天";
  if(diff<7)return "本周";
  if(diff<30)return "本月";
  return `${d.getFullYear()}年${d.getMonth()+1}月`;
}

let curSource="",offset=0,mode="list";
function chipHTML(){return [["","全部"],["clip","✂️剪藏"],["rss","📰订阅"],["tg","🤖TG"],
["doc","📄文档"],["book","📚书籍"]].map(([v,t])=>
`<span class="chip${v===curSource?" on":""}" onclick="setSrc('${v}')">${t}</span>`).join("");}
function setSrc(v){curSource=v;$("#chips").innerHTML=chipHTML();
$("#q").value="";mode="list";offset=0;$("#list").innerHTML="";loadList();}

function cardHTML(d,snippet){
  const tags=(d.tags||[]).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const body=snippet?snippet:esc(d.tldr||"");
  return `<div class="card" onclick="view(${d.id})">
  <h3>${esc(d.title)}</h3>
  <div class="tldr">${body}</div>
  <div class="meta">${srcBadge(d.source)}<span>${relTime(d.created_at)}</span>${tags}</div>
  </div>`;
}
async function loadStats(){
  try{const s=await api("/v1/stats");
  $("#stat").textContent=`${s.items.done||0} 条知识卡 · ${(s.tokens.total/1e6).toFixed(2)}M tokens`;
  }catch(e){$("#stat").textContent="连接失败";}
}
async function loadList(){
  $("#more").textContent="加载中…";$("#more").style.display="block";
  const d=await api(`/v1/items?limit=20&offset=${offset}${curSource?"&source="+curSource:""}`);
  const items=d.items||[];
  if(!items.length&&!offset){
    $("#list").innerHTML=`<p class="empty"><span class="big">🌱</span><br>
    知识库还空着<br><span class="dimm">网页选中文字按 Ctrl+Shift+K，或转发链接给 TG Bot</span></p>`;
    $("#more").style.display="none";return;}
  let html="",lastG="";
  for(const it of items){
    const g=gdate(it.created_at);
    if(g!==lastG){html+=`<div class="gdate">${g}</div>`;lastG=g;}
    html+=cardHTML(it);
  }
  if(offset===0)$("#list").innerHTML="";
  $("#list").insertAdjacentHTML("beforeend",html);
  offset+=items.length;
  $("#more").textContent="加载更多";
  $("#more").style.display=items.length>=20?"block":"none";
}
$("#more").onclick=loadList;

async function doSearch(){
  const q=$("#q").value.trim();
  if(!q){mode="list";offset=0;$("#list").innerHTML="";return loadList();}
  mode="search";
  $("#list").innerHTML=`<p class="empty"><span class="spin"></span> 检索中…</p>`;
  const d=await api("/v1/search?q="+encodeURIComponent(q)+"&k=20");
  const items=(d.items||[]).filter(x=>!curSource||x.source===curSource);
  $("#list").innerHTML=items.length
    ?items.map(x=>cardHTML(x,x.snippet)).join("")
    :`<p class="empty"><span class="big">🔍</span><br>没有找到「${esc(q)}」<br>
      <span class="dimm">试试更短的关键词，或换种说法</span></p>`;
  $("#more").style.display="none";
}
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});

async function view(id){
  const d=await api("/v1/item/"+id),c=d.card||{};
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  let deep="";
  if(c.deep){
    const secs=c.deep.split(/^##\s*/m).filter(x=>x.trim());
    deep=`<div class="sect">🧠 深度解读</div>`+(secs.length>1
      ?secs.map(s=>{const[n,...rest]=s.split("\n");
        return `<p style="margin:8px 0"><b>${esc(n)}</b><br>${esc(rest.join("\n"))}</p>`;}).join("")
      :`<p style="white-space:pre-wrap;margin-top:6px">${esc(c.deep)}</p>`);
  }
  const fcs=(c.flashcards||[]).map(f=>`<div class="fc"><b>Q：${esc(f.q)}</b><br>${esc(f.a)}</div>`).join("");
  const rel=(c.related||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  $("#dlg").innerHTML=`
  <h2>${esc(d.title)}</h2>
  <div class="mmeta">${srcBadge(d.source)} · ${d.created_at}${d.url?` · <a href="${esc(d.url)}" target="_blank">原文链接 ↗</a>`:""}
  ${d.status!=="done"?` · <span style="color:var(--warn)">${esc(d.status)} ${esc(d.error||"")}</span>`:""}</div>
  ${c.tldr?`<div class="tldrbox">💡 ${esc(c.tldr)}</div>`:""}
  ${(c.points||[]).length?`<div class="sect">📌 要点</div><ul class="pts">${li(c.points)}</ul>`:""}
  ${(c.quotes||[]).length?`<div class="sect">💬 金句</div>
  ${c.quotes.map(q=>`<blockquote>${esc(q)}</blockquote>`).join("")}`:""}
  ${(c.tags||[]).length?`<div style="margin-top:14px">${c.tags.map(t=>
  `<span class="chip" onclick="qsearch('${esc(t).replace(/'/g,"")}')">${esc(t)}</span>`).join("")}</div>`:""}
  ${deep}
  ${(c.questions||[]).length?`<div class="sect">❓ 值得深挖</div><ul class="pts">${li(c.questions)}</ul>`:""}
  ${fcs?`<div class="sect">🎴 闪卡</div>${fcs}`:""}
  ${rel?`<div class="sect">🔗 库内关联</div><ul class="pts">${rel}</ul>`:""}
  <details style="margin-top:16px"><summary class="dimm">查看原文</summary>
  <pre class="raw">${esc(d.raw_text)}</pre></details>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
  <button onclick="re1(${d.id})">重新加工</button>
  <button onclick="del1(${d.id})" style="color:var(--warn)">删除</button>
  <button class="primary" onclick="dlg.close()">关闭</button></div>`;
  dlg.showModal();
}
function qsearch(t){dlg.close();$("#q").value=t;doSearch();}
async function del1(id){if(!confirm("确认删除这条？"))return;
  await api("/v1/item/"+id,{method:"DELETE"});dlg.close();
  toast("已删除");refresh();}
async function re1(id){toast("重新加工中…");
  await api("/v1/item/"+id+"/reprocess",{method:"POST"});dlg.close();
  toast("✅ 知识卡已重新生成");refresh();}

$("#add").onclick=()=>{clipdlg.showModal();$("#c_text").focus();};
async function doClip(){
  const t=$("#c_text").value.trim();
  if(t.length<20){$("#c_msg").textContent="正文太短（至少 20 字）";return;}
  $("#c_go").disabled=true;$("#c_msg").textContent="处理中…";
  try{
    const r=await api("/v1/clip",{method:"POST",body:JSON.stringify({
      text:t,url:$("#c_url").value.trim(),title:$("#c_title").value.trim(),source:"clip",sync:true})});
    $("#c_msg").textContent=r.dup?`这条已经在库里了（#${r.id}）`:`✅ 已入库 #${r.id}`;
    if(!r.dup){$("#c_text").value="";$("#c_url").value="";$("#c_title").value="";
      toast("✅ 已入库");refresh();setTimeout(()=>clipdlg.close(),900);}
  }catch(e){$("#c_msg").textContent="失败：服务器无响应";}
  $("#c_go").disabled=false;
}
function refresh(){loadStats();
  if(mode==="search")doSearch();else{offset=0;$("#list").innerHTML="";loadList();}}

/* 模型设置入口 */
$("#cfgbtn").onclick=async()=>{
  const s=await api("/v1/settings");
  $("#s_base").value=s.api_base;$("#s_chat").value=s.chat_model;
  $("#s_embed").value=s.embed_model;$("#s_dim").value=s.embed_dim;
  $("#s_key").value="";
  $("#s_key").placeholder=s.key_masked?`已配置 (${s.key_masked})，留空沿用`:"尚未配置，请粘贴 Key";
  $("#s_msg").textContent=s.reembed_running?"⚠️ 向量重建进行中，稍候…":"";
  setdlg.showModal();};
async function saveCfg(){
  await api("/v1/settings",{method:"POST",body:JSON.stringify({
    api_base:$("#s_base").value.trim(),api_key:$("#s_key").value.trim(),
    chat_model:$("#s_chat").value.trim(),embed_model:$("#s_embed").value.trim(),
    embed_dim:+$("#s_dim").value||0})});
  $("#s_msg").textContent="✅ 已保存并即时生效（新条目将使用新模型）";
  toast("设置已保存");loadStats();}
async function testCfg(){
  $("#s_msg").textContent="测试中（约 5 秒）…";
  try{const r=await api("/v1/settings/test",{method:"POST",body:"{}"});
  $("#s_msg").textContent=r.ok
    ?`✅ 连接正常 · 聊天:「${r.chat}」 · 向量维度:${r.embed_dim}`
    :`❌ ${r.error}`;}catch(e){$("#s_msg").textContent="❌ 测试请求失败";}}
async function reembed(){
  const r=await api("/v1/settings/reembed",{method:"POST",body:"{}"});
  if(r.ok){$("#s_msg").textContent="🔄 向量重建已开始，后台运行几分钟，完成后语义搜索即用新模型";
  toast("重建已开始");}else toast(r.error||"失败");}

$("#chips").innerHTML=chipHTML();
loadStats();loadList();
</script>
</body>
</html>
